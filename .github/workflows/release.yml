name: Release

# Publishing a GitHub release tagged vX.Y.Z publishes that version of every
# package. Both registries trust this workflow (OIDC), so no tokens are
# stored: PyPI through the trusted publisher for project "herceg" (workflow
# release.yml, environment pypi), npm through each package's trusted
# publisher, which npm lets a package have once it exists.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME"

  pypi:
    needs: check
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v10.3.0
      - run: npm ci
      - run: npm run test:python-package
      - run: rm -rf python/dist && cd python && uv build
      - run: node scripts/check-pypi.mjs "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          skip-existing: true
      # Also verify after uploading: a racing upload must never hide a mismatch.
      - run: node scripts/check-pypi.mjs "$RELEASE_VERSION" --require-all
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}

  npm:
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run test:package
      # Publishing through a trusted publisher needs npm 11.5.1 or later.
      - run: npm install --global npm@11
      # Verify exact tarball integrity on reruns, including the manual bootstrap.
      - run: node scripts/publish-npm.mjs --publish
