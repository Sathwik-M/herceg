[project]
name = "herceg"
version = "0.0.0"
description = "Fast, columnar charts for Python, rendered by the herceg engine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "typing_extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
polars = ["polars>=1.0"]
arrow = ["pyarrow>=14"]
export = ["mini-racer>=0.12", "resvg-py>=0.1"]
notebook = ["anywidget>=0.9"]
streamlit = ["streamlit>=1.51"]
# herceg.express uses SciPy's hierarchical clustering when it is installed.
stats = ["scipy>=1.11"]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas>=2.0",
  "polars>=1.0",
  "pyarrow>=14",
  "mini-racer>=0.12",
  "resvg-py>=0.1",
  "anywidget>=0.9",
  "streamlit>=1.51",
  "scipy>=1.11",
  # References herceg.express is checked against.
  "seaborn>=0.13",
  "statsmodels>=0.14",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/herceg"]
# The JavaScript bundles are build outputs (npm run build:python), so they
# are not tracked by git but must ship in every distribution.
artifacts = ["src/herceg/static/*.js"]

[tool.hatch.build.targets.sdist]
artifacts = ["src/herceg/static/*.js"]

# hatch_build.py: fails the build when the bundles are missing.
[tool.hatch.build.hooks.custom]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:py_mini_racer"]

[tool.mypy]
python_version = "3.10"
files = ["src/herceg", "tests/typing"]
# Optional dataframe and export libraries are typed or not; herceg's annotations are checked.
ignore_missing_imports = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
